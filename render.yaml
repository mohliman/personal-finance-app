services:
  - type: web
    name: baqir-personal-finance
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADDITIONAL_APP_ORIGINS
        value: https://personal-finance-ui.vercel.app
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
